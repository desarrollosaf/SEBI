services:
  sebi:
    build: .
    image: sebi:latest
    container_name: sebi
    restart: unless-stopped
    environment:
      SEBI_BASE: /sebi
    ports:
      # HTTP interno; el HTTPS lo da Apache (https://siasaf.gob.mx/sebi/)
      - "8211:8080"
    volumes:
      - sebi_data:/data

volumes:
  sebi_data:
